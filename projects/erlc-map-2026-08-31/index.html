    function render() { world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; }
    function fit() { scale = Math.min(viewport.clientWidth, viewport.clientHeight) / 4096; x = (viewport.clientWidth - 4096 * scale) / 2; y = (viewport.clientHeight - 4096 * scale) / 2; render(); }
    function zoom(factor, px = viewport.clientWidth / 2, py = viewport.clientHeight / 2) { const next = Math.max(0.08, Math.min(4, scale * factor)); x = px - (px - x) * next / scale; y = py - (py - y) * next / scale; scale = next; render(); }
    viewport.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, {passive: false});
    viewport.addEventListener('pointerdown', e => { drag = {x: e.clientX - x, y: e.clientY - y}; viewport.setPointerCapture(e.pointerId); viewport.classList.add('dragging'); });
    viewport.addEventListener('pointermove', e => { if (drag) { x = e.clientX - drag.x; y = e.clientY - drag.y; render(); } });
    viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
    viewport.addEventListener('pointercancel', () => { drag = null; viewport.classList.remove('dragging'); });
    document.getElementById('zin').onclick = () => zoom(1.25);
    document.getElementById('zout').onclick = () => zoom(0.8);
    document.getElementById('fit').onclick = fit;
    const sidebar = document.getElementById('sidebar');
    const layersButton = document.getElementById('layersButton');
    layersButton.onclick = () => { sidebar.hidden = !sidebar.hidden; layersButton.setAttribute('aria-expanded', String(!sidebar.hidden)); };
    const svgNS = 'http://www.w3.org/2000/svg';
    const groups = {0:'General',1:'Spawns',2:'Other',3:'Labels',4:'NPCs',5:'Areas'};
    const layerList = document.getElementById('layerList');
    const markerRoot = document.getElementById('markers');
    const shapeRoot = document.getElementById('shapes');
    for (const groupId of [0,1,2,4,3,5]) {
      const heading = document.createElement('h2'); heading.textContent = groups[groupId]; layerList.append(heading);
      for (const layer of archivedLayers.filter(l => l.group === groupId)) {
        const row = document.createElement('label'); row.dataset.name = layer.name.toLowerCase();
        const check = document.createElement('input'); check.type = 'checkbox';
        const title = document.createElement('span'); title.textContent = layer.name;
        const count = document.createElement('small'); count.textContent = layer.items.length;
        row.append(check, title, count); layerList.append(row);
        const elements = [];
        for (const item of layer.items) {
          let element;
          if (item.type === 'marker') {
            element = document.createElement(item.icon ? 'img' : 'span');
            element.className = item.icon ? 'marker' : 'marker fallback';
            if (item.icon) { element.src = item.icon; element.onerror = () => { element.className = 'marker fallback'; element.removeAttribute('src'); }; }
            element.style.left = item.points[0][0] + 'px'; element.style.top = item.points[0][1] + 'px';
            element.title = item.label; markerRoot.append(element);
          } else if (item.type === 'circleMarker') {
            element = document.createElement('span'); element.className = 'label'; element.textContent = item.label;
            element.style.left = item.points[0][0] + 'px'; element.style.top = item.points[0][1] + 'px';
            if (item.fontSize) element.style.fontSize = (item.fontSize * 4) + 'px';
            if (item.rotation) element.style.transform = `translate(-50%, -50%) rotate(${item.rotation}deg)`;
            if (item.textColor) { element.style.color = item.textColor; if (item.textColor.toLowerCase() === 'black') element.classList.add('dark'); }
            markerRoot.append(element);
          } else {
            element = document.createElementNS(svgNS, item.type === 'circle' ? 'circle' : item.type === 'polygon' ? 'polygon' : 'polyline');
            element.setAttribute('class', 'shape'); element.setAttribute('stroke', item.color || '#ffd33d');
            if (item.type === 'circle') { element.setAttribute('cx', item.points[0][0]); element.setAttribute('cy', item.points[0][1]); element.setAttribute('r', item.radius || 20); }
            else element.setAttribute('points', item.points.map(p => p.join(',')).join(' '));
            const tip = document.createElementNS(svgNS, 'title'); tip.textContent = item.label; element.append(tip); shapeRoot.append(element);
            if (layer.name === 'Location Callouts' && item.type === 'polygon') {
              const callout = document.createElement('span'); callout.className = 'callout-name'; callout.textContent = item.label;
              callout.style.left = (item.points.reduce((sum, p) => sum + p[0], 0) / item.points.length) + 'px';
              callout.style.top = (item.points.reduce((sum, p) => sum + p[1], 0) / item.points.length) + 'px';
              callout.style.display = 'none'; markerRoot.append(callout); elements.push(callout);
            }
          }
          element.style.display = 'none'; elements.push(element);
        }
        check.onchange = () => { for (const element of elements) element.style.display = check.checked ? '' : 'none'; };
      }
    }
    document.getElementById('search').oninput = e => { const q = e.target.value.toLowerCase(); for (const row of layerList.querySelectorAll('label')) row.hidden = !row.dataset.name.includes(q); };
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
